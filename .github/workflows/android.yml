name: Build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: ./Cite
      - name: Lint
        run: ./gradlew lint
        working-directory: ./Cite
      - name: Build the app
        run: ./gradlew build
        working-directory: ./Cite
